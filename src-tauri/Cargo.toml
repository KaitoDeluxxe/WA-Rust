[package]
name = "whatsapp-desktop"
version = "0.1.0"
description = "Lightweight cross-platform desktop wrapper for WhatsApp Web"
authors = ["WhatsApp Desktop Light Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "whatsapp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true